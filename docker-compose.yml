version: '3.8'

services:
  uvr5:
    build: .
    runtime: nvidia
    # [新增] Host 模式：讓容器直接使用本機網路堆疊，
    # 這能解決 X11 連線不穩以及 PulseAudio 的溝通問題
    network_mode: host 
    
    environment:
      - DISPLAY=$DISPLAY
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics,display
      - PULSE_SERVER=unix:${XDG_RUNTIME_DIR}/pulse/native
      # [新增] 指定容器內的 XAuthority 路徑
      - XAUTHORITY=/root/.Xauthority
      
    volumes:
      - ./volumes:/volumes
      - ./src:/app/src
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XDG_RUNTIME_DIR}/pulse/native:${XDG_RUNTIME_DIR}/pulse/native
      - ~/.config/pulse/cookie:/root/.config/pulse/cookie
      # [新增] 關鍵：將宿主機的 X 認證檔案掛載給容器內的 root 使用
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:rw
    
    working_dir: /app/src
    
    # ipc: host 在 network_mode: host 下通常是預設的，但寫著無妨
    ipc: host
    command: python UVR.py
